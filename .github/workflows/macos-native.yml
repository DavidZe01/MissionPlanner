name: macOS native (Cocoa)

# Mission Planner on .NET for macOS with the Cocoa Windows Forms backend
# (ExtLibs/mac-playground): no Mono, no XQuartz. Runs only on request, when a
# push to macos-arm64 changes .github/macos-native-request (ordinary pushes
# start nothing), or from the Actions "Run workflow" button.
on:
  push:
    branches: [macos-arm64]
    paths: ['.github/macos-native-request']
  workflow_dispatch:

concurrency:
  group: macos-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Build and run on macOS
    # the owner's own Mac (self-hosted runner, no GitHub-hosted macOS queue); default labels
    # for a runner registered without --labels. Revert to `runs-on: macos-26` for a
    # GitHub-hosted runner (disposable VM, but Apple Silicon macOS runners can queue for a
    # long time depending on capacity).
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 100
    permissions:
      # write: the results go to the ci-native branch from here (last step)
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - id: sitl
        # the ArduPilot simulators of the newest macos-arm64.yml run (its "sitl" job), bundled into the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=sitl&per_page=50" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty' || true)
          echo "sitl artifact: run ${run:-none}"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.sitl.outputs.run != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sitl
          path: sitl-bin
          run-id: ${{ steps.sitl.outputs.run }}
          github-token: ${{ github.token }}
      - name: SITL simulators kept on this Mac
        # a self-hosted runner keeps the simulators between runs, so the app still bundles
        # them when no "sitl" artifact is left (they expire, and the artifact storage can be
        # full): the newest artifact, else the copy kept here, else the app the last run
        # installed (build.sh puts them in Contents/Resources/sitl)
        if: runner.environment == 'self-hosted'
        run: |
          cache="$HOME/Library/Caches/MissionPlanner-native/sitl-bin"
          installed="$HOME/Applications/Mission Planner.app/Contents/Resources/sitl"
          mkdir -p "$(dirname "$cache")"
          if [[ -f sitl-bin/ArduCopter ]]; then
              rm -rf "$cache" && cp -R sitl-bin "$cache"
              echo "SITL: from the artifact (kept in $cache)"
          elif [[ -f $cache/ArduCopter ]]; then
              rm -rf sitl-bin && cp -R "$cache" sitl-bin
              echo "SITL: kept on this Mac"
          elif [[ -f $installed/ArduCopter ]]; then
              rm -rf sitl-bin "$cache" && cp -R "$installed" "$cache" && cp -R "$cache" sitl-bin
              echo "SITL: from the app the last run installed"
          else
              echo "SITL: none (no artifact and none kept on this Mac)"
          fi
          chmod +x sitl-bin/Ardu* 2>/dev/null || true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Tools
        timeout-minutes: 15
        run: |
          mkdir -p out
          { sw_vers; uname -m; xcodebuild -version; xcode-select -p; ls -d /Applications/Xcode*; dotnet --version; } 2>&1 | tee out/environment.txt
          # .NET for macOS pinned to the workload version matching the runner's Xcode: GitHub's
          # macos-26 runner has Xcode 26.6, which needs the 26.5.10318 workload (the newest
          # workload, 27.x, needs Xcode 27 and targets the macOS 27 SDK). A self-hosted runner
          # (someone's own, possibly newer, Mac) may have a newer Xcode instead, so detect it.
          cd "$RUNNER_TEMP"
          dotnet workload config --update-mode manifests
          xcode_major=$(xcodebuild -version | awk '/^Xcode /{split($2, v, "."); print v[1]; exit}')
          if [[ ${xcode_major:-0} -ge 27 ]]; then
              echo "Xcode $xcode_major.x: updating to the newest macos workload (targets the macOS 27 SDK)"
              dotnet workload update 2>&1 | tail -5 | tee -a "$GITHUB_WORKSPACE/out/environment.txt"
              dotnet workload install macos 2>&1 | tail -3 | tee -a "$GITHUB_WORKSPACE/out/environment.txt"
          else
              echo '{"microsoft.net.sdk.macos": "26.5.10318/10.0.100"}' > rollback.json
              dotnet workload install macos --from-rollback-file rollback.json 2>&1 | tail -3 | tee -a "$GITHUB_WORKSPACE/out/environment.txt"
          fi
          dotnet workload list 2>&1 | tee -a "$GITHUB_WORKSPACE/out/environment.txt"
          # .NET stacks of a hung screen-tour step (macOS/native/tour-hang.sh)
          dotnet tool install --global dotnet-stack 2>&1 | tail -1 || true
          # native libraries bundled into the app: joysticks (SDL), DFU flashing (libusb) and
          # GStreamer with its plugins (relocated into the app by dylibbundler, see build.sh)
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install sdl2 libusb gstreamer dylibbundler cmake 2>&1 | tail -2
      - name: Build the Windows Forms test app
        # validated on macOS 26: only when the request commit asks for [formstest]
        if: contains(github.event.head_commit.message, '[formstest]')
        timeout-minutes: 15
        run: |
          build() { dotnet build ExtLibs/mac-playground/FormsTest/FormsTest.csproj -c Release -r osx-arm64 > out/build-formstest.log 2>&1; }
          if ! build && grep -q -i 'xcode' out/build-formstest.log; then
              # the workload may want the Xcode it was built with
              echo "retrying with Xcode 26.5" | tee -a out/environment.txt
              cp out/build-formstest.log out/build-formstest-xcode-default.log
              export DEVELOPER_DIR=/Applications/Xcode_26.5.app/Contents/Developer
              echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
              build || true
          fi
          grep -E 'error|warning MT|Build succeeded' out/build-formstest.log | sort -u | head -20 || true
          find ExtLibs/mac-playground/FormsTest/bin -maxdepth 4 -name '*.app' -path '*arm64*' | tee out/apps.txt
      - name: Run the test app
        # validated on macOS 26: only when the request commit asks for [formstest]
        if: contains(github.event.head_commit.message, '[formstest]')
        timeout-minutes: 5
        run: |
          app=$(head -1 out/apps.txt)
          exe="$app/Contents/MacOS/$(defaults read "$PWD/$app/Contents/Info" CFBundleExecutable)"
          file "$exe" | tee -a out/environment.txt
          "$exe" > out/formstest-run.log 2>&1 &
          pid=$!
          sleep 10
          # started from a shell the app is not brought to the front
          osascript -e "tell application id \"com.emclient.formstest.1\" to activate" || true
          sleep 10
          screencapture -x out/formstest.png || true
          if kill -0 "$pid" 2>/dev/null; then echo "FORMSTEST running after 20 s" | tee -a out/result.txt; else echo "FORMSTEST exited: $(wait "$pid"; echo $?)" | tee -a out/result.txt; fi
          kill "$pid" 2>/dev/null || true
          tail -20 out/formstest-run.log
      - name: Build Mission Planner
        timeout-minutes: 25
        run: |
          # app icon from the Windows one
          iconset=macOS/native/obj/MissionPlanner.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
              sips -z $size $size mpdesktop150.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
              sips -z $((size * 2)) $((size * 2)) mpdesktop150.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o macOS/native/obj/MissionPlanner.icns
          [[ -f sitl-bin/ArduCopter ]] && export MP_SITL_DIR=$PWD/sitl-bin && cat sitl-bin/VERSION.txt
          ./macOS/native/build.sh > out/build-missionplanner.log 2>&1 || echo "BUILD FAILED" | tee -a out/result.txt
          grep -E ' error |Build succeeded|Time Elapsed|^GStreamer' out/build-missionplanner.log | sort -u | head -30 || true
          # the app must not need Homebrew's GStreamer: remove it before the tests
          HOMEBREW_NO_AUTO_UPDATE=1 brew uninstall --ignore-dependencies gstreamer 2>&1 | tail -1 || true
          find bin/Release/net461 -maxdepth 1 -name '*.app' | tee out/mp-app.txt
          app=$(head -1 out/mp-app.txt)
          if [[ -n $app ]]; then
              du -sh "$app" | tee -a out/result.txt
              # the app to download (ditto keeps the bundle's signature and symlinks)
              ditto -c -k --keepParent "$app" MissionPlanner-macos-native-arm64.zip
              (cd "$app/Contents" && find . -maxdepth 2 | sort | head -80) > out/mp-app-contents.txt
              ls bin/Release/net461 | head -100 > out/mp-output-dir.txt
          fi
      - name: Load the bundled native libraries
        timeout-minutes: 2
        run: |
          # The libraries build.sh adds to Contents/MonoBundle (SDL for joysticks, libusb for
          # DFU flashing, SimpleBLE, ...), each loaded by a fresh process: one with a broken
          # signature gets the process killed (SIGKILL) inside dlopen, which in the app looks
          # like a crash of the feature that first loads it (the joystick, until build.sh
          # signed them one by one).
          app=$(head -1 out/mp-app.txt)
          [[ -n $app ]] || { echo "no app"; exit 1; }
          cc -O0 -o out/dlopen-probe macOS/native/dlopen-probe.c
          for lib in libSDL2-2.0.0 libSDL3 libusb-1.0.0 libsimplecble libsimpleble libuser32stub; do
              dylib="$app/Contents/MonoBundle/$lib.dylib"
              [[ -f $dylib ]] || { echo "LIBRARY $lib: not bundled"; continue; }
              rc=0
              out=$(perl -e 'alarm 20; exec @ARGV' out/dlopen-probe "$dylib" main 2>&1) || rc=$?
              case $rc in
                  0) echo "LIBRARY $lib: $(tail -1 <<< "$out")" ;;
                  137) echo "LIBRARY $lib: KILLED (SIGKILL in dlopen: invalid signature?)" | tee -a out/result.txt ;;
                  142) echo "LIBRARY $lib: TIMEOUT (still in dlopen after 20 s)" | tee -a out/result.txt ;;
                  *) echo "LIBRARY $lib: exit $rc: $out" | tee -a out/result.txt ;;
              esac
          done
      - name: Run Mission Planner
        timeout-minutes: 9
        run: |
          app=$(head -1 out/mp-app.txt)
          [[ -n $app ]] || { echo "no app"; exit 1; }
          # a data/log directory of its own: a self-hosted runner may be someone's everyday Mac,
          # and a direct run (outside the screen tour) must not touch the real
          # ~/Library/Application Support/Mission Planner or ~/Library/Logs/Mission Planner
          data_dir="$RUNNER_TEMP/mp-data-run"
          MISSIONPLANNER_FIRSTCHANCE=1 MISSIONPLANNER_DATA_DIR="$data_dir" ALLUSERSPROFILE="$data_dir-logs" \
              "$app/Contents/MacOS/MissionPlanner" > out/mp-run.log 2>&1 &
          pid=$!
          for t in 15 45 90; do
              sleep $(( t == 15 ? 15 : 30 ))
              # (an app that does not answer Apple events would hold osascript for minutes)
              if ! perl -e 'alarm 15; exec @ARGV' osascript -e 'tell application id "org.ardupilot.missionplanner" to activate' > /dev/null 2>&1; then
                  echo "no answer to an Apple event after ${t} s" | tee -a out/result.txt
                  TOUR_PID=$pid TOUR_ITEM="startup-${t}s" TOUR_OUT="$PWD/out" ./macOS/native/tour-hang.sh
              fi
              sleep 1
              screencapture -x "out/mp-${t}s.png" || true
              kill -0 "$pid" 2>/dev/null || break
          done
          if kill -0 "$pid" 2>/dev/null; then echo "MISSIONPLANNER running after 90 s" | tee -a out/result.txt; else echo "MISSIONPLANNER exited: $(wait "$pid"; echo $?)" | tee -a out/result.txt; fi
          kill "$pid" 2>/dev/null || true
          sleep 2; kill -9 "$pid" 2>/dev/null || true
          tail -40 out/mp-run.log
          cp -R "$HOME/Library/Logs/DiagnosticReports" out/crash-reports 2>/dev/null || true
          [[ -f "$data_dir-logs/Mission Planner/MissionPlanner.log" ]] && cp "$data_dir-logs/Mission Planner/MissionPlanner.log" out/MissionPlanner.log
          true
      - name: Screen tour
        # macOS/ScreenTour.cs inside the app: every screen, page and window, with screenshots
        timeout-minutes: 40
        run: |
          app=$(head -1 out/mp-app.txt)
          [[ -n $app ]] || exit 0
          exe="$app/Contents/MacOS/MissionPlanner"
          mkdir -p out/tour
          run_limited() { # seconds command...
              local limit=$1; shift
              "$@" & local pid=$! elapsed=0
              while kill -0 "$pid" 2>/dev/null; do
                  if (( elapsed >= limit )); then kill -QUIT "$pid" 2>/dev/null; sleep 5; kill -KILL "$pid" 2>/dev/null; wait "$pid" 2>/dev/null; return 124; fi
                  sleep 1; elapsed=$((elapsed + 1))
              done
              wait "$pid"
          }
          # a step that hangs ends the run (TOUR HANG, stacks from tour-hang.sh); the next run resumes after it
          for attempt in 1 2 3 4 5 6; do
              # DYLD_PRINT_LIBRARIES: every library the process loads, to check where they come from
              MISSIONPLANNER_TOUR=1 MISSIONPLANNER_FIRSTCHANCE=1 TOUR_OUT="$PWD/out/tour" TOUR_XWD=/usr/sbin/screencapture \
                  TOUR_STEP_TIMEOUT=90 TOUR_HANG_CMD="$PWD/macOS/native/tour-hang.sh" DYLD_PRINT_LIBRARIES=1 \
                  MISSIONPLANNER_SDL_TRACE=1 \
                  run_limited 1500 "$exe" >> out/tour.log 2>&1 || true
              grep -q '^TOUR_DONE' out/tour.log && break
          done
          grep -E '^TOUR_(RUNTIME|DONE)|^TOUR HANG|^TOUR CRASH|^TOUR FAIL|^TOUR mainmenu|^TOUR dialog closed|^TOUR hang dump|^TOUR hud|^TOUR map|^TOUR NEEDS VEHICLE|^TOUR gstreamer' out/tour.log | cut -c1-220 | head -120 || true
          # OpenGL (NSOpenGLContext) and the bundled GStreamer
          grep -E 'HUD OpenGL|OpenGL context|OpenGL backing scale|OpenGL pixel format|Vendor:|Version:|Device:|gl True|Found gstreamer|GStreamer [0-9]' out/tour.log | sort | uniq -c | sort -rn | head -12 || true
          cp -R "$HOME/Library/Logs/DiagnosticReports" out/crash-reports-tour 2>/dev/null || true
          python3 macOS/summarize-tour.py out/tour/tour-report.tsv | tail -60 || true
          # libraries loaded by the app (GStreamer, SDL, libusb, SimpleBLE...): none from Homebrew
          grep -E '^dyld\[[0-9]+\]: ' out/tour.log | sed -E 's/^dyld\[[0-9]+\]: //' | sort -u > out/libraries-loaded.txt || true
          echo "libraries loaded: $(wc -l < out/libraries-loaded.txt), from the app: $(grep -c 'Mission Planner.app/' out/libraries-loaded.txt), bundled GStreamer: $(grep -c 'MonoBundle/gstreamer/' out/libraries-loaded.txt)"
          echo "LIBRARIES FROM HOMEBREW OR /usr/local: $(grep -cE '^/(opt/homebrew|usr/local)/' out/libraries-loaded.txt)"
          grep -E '^/(opt/homebrew|usr/local)/' out/libraries-loaded.txt | head -20 || true
          # where each hung step was stuck: the thread running the tour, then the native main thread
          for f in out/tour/hang-*-managed.txt; do
              [[ -f $f ]] || continue
              echo "=== $f"
              python3 - "$f" <<'EOF'
          import re, sys
          text = open(sys.argv[1], errors="replace").read()
          blocks = re.split(r"\n(?=\s*Thread \()", text)
          main = [b for b in blocks if "ScreenTour" in b or "Application.Run" in b]
          for b in (main or blocks[:2]):
              print("\n".join(line[:200] for line in b.splitlines()[:45]))
          EOF
          done
          for f in out/tour/hang-*-native.txt; do
              [[ -f $f ]] || continue
              echo "=== $f"
              grep -A30 'com.apple.main-thread' "$f" | cut -c1-200 | head -32 || true
              # the other threads and where they wait (OpenGL, locks)
              grep -E 'Thread_[0-9]+|libGL|GLEngine|libGPUSupport|CGL|__psynch|semaphore_wait|WaitHandle|Monitor' "$f" | cut -c1-180 | head -60 || true
          done
          true
      - name: Connected tour
        # the bundled ArduCopter simulator: connect over TCP, parameters, mission upload and
        # download, MAVFTP, onboard logs, arm and take off, the main screens and one page
        timeout-minutes: 20
        run: |
          app=$(head -1 out/mp-app.txt)
          [[ -n $app ]] || exit 0
          # absolute: the simulator runs in its own directory
          app=$PWD/$app
          sitl_dir="$app/Contents/Resources/sitl"
          [[ -x $sitl_dir/ArduCopter ]] || { echo "SITL: not bundled"; exit 0; }
          simdir=$(mktemp -d) sitl_log=$PWD/out/sitl.log
          (cd "$simdir" && exec "$sitl_dir/ArduCopter" -Mquad -O-35.363261,149.165230,584,353 -s1 \
              --serial0 tcp:0 --defaults "$sitl_dir/copter.parm" > "$sitl_log" 2>&1) &
          sitl_pid=$!
          sleep 8
          kill -0 "$sitl_pid" 2>/dev/null || { echo "SITL: did not start"; tail -20 out/sitl.log; exit 0; }
          mkdir -p out/tour-connected
          MISSIONPLANNER_TOUR=1 TOUR_OUT="$PWD/out/tour-connected" TOUR_XWD=/usr/sbin/screencapture \
              TOUR_CONNECT=tcp:127.0.0.1:5760 TOUR_ONLY=ConfigFlightModes,ConfigHWCompass2 TOUR_STEP_TIMEOUT=150 MISSIONPLANNER_NO_OPENGL=1 \
              TOUR_HANG_CMD="$PWD/macOS/native/tour-hang.sh" \
              "$app/Contents/MacOS/MissionPlanner" > out/tour-connected.log 2>&1 &
          pid=$!
          for _ in $(seq 1 900); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          kill -9 "$pid" 2>/dev/null || true
          kill "$sitl_pid" 2>/dev/null || true
          grep -E '^TOUR_DONE|^TOUR HANG|^TOUR FAIL|^TOUR connected|^TOUR (parameters|parameter |mission|mavftp|onboard|altitude)' out/tour-connected.log | cut -c1-220 || true
          python3 macOS/summarize-tour.py out/tour-connected/tour-report.tsv | tail -30 || true
      - name: Open a telemetry log from Finder
        # LaunchServices hands the file to the app as an Apple event (Info.plist document types)
        timeout-minutes: 5
        run: |
          app=$(head -1 out/mp-app.txt)
          # the connected tour's log (its data directory is under $TMPDIR; the real
          # ~/Library/Application Support/Mission Planner may not even exist, since every
          # direct run in this workflow isolates to its own MISSIONPLANNER_DATA_DIR now -
          # find on a missing root exits non-zero and (-e -o pipefail) would abort the step)
          roots=()
          for d in "${TMPDIR:-/tmp}" "$HOME/Library/Application Support/Mission Planner"; do
              [[ -d $d ]] && roots+=("$d")
          done
          tlog=""
          [[ ${#roots[@]} -gt 0 ]] && tlog=$(find "${roots[@]}" -name '*.tlog' -size +10k 2>/dev/null | head -1)
          [[ -n $app && -n $tlog ]] || { echo "no app or no telemetry log from the connected tour"; exit 0; }
          ls -la "$tlog"
          export MISSIONPLANNER_DATA_DIR="$RUNNER_TEMP/mp-data-open" ALLUSERSPROFILE="$RUNNER_TEMP/mp-data-open-logs"
          open -a "$PWD/$app" --stdout "$PWD/out/open-document.log" --stderr "$PWD/out/open-document.log" "$tlog"
          sleep 50
          perl -e 'alarm 15; exec @ARGV' osascript -e 'tell application id "org.ardupilot.missionplanner" to activate' > /dev/null 2>&1 || true
          sleep 5
          screencapture -x out/open-document.png || true
          grep -m1 MACOS_OPEN_DOCUMENT out/open-document.log && echo "OPEN DOCUMENT: OK" || echo "OPEN DOCUMENT: not received"
          # only this copy: on a self-hosted runner the owner may have their own one open
          pkill -f "$PWD/$app/Contents/MacOS/MissionPlanner" || true
      - name: Retina (HiDPI) display
        # a virtual 2x display (hidpi-display.m) made the main one: the app with the HUD drawn by
        # OpenGL and by GDI+ at Retina resolution
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          app=$(head -1 out/mp-app.txt); [[ -n $app ]] || exit 0
          app=$PWD/$app
          clang -fobjc-arc -framework Foundation -framework CoreGraphics macOS/native/hidpi-display.m -o "$RUNNER_TEMP/hidpi-display"
          "$RUNNER_TEMP/hidpi-display" 1280 800 > out/hidpi-display.log 2>&1 &
          display_pid=$!
          sleep 6
          cat out/hidpi-display.log
          grep -q 'main=yes' out/hidpi-display.log || { echo "RETINA: no HiDPI main display"; kill "$display_pid" 2>/dev/null; exit 0; }
          # its own, brand new data/log directory: nothing to carry a stale window position from,
          # and (self-hosted) the real ~/Library/Application Support/Mission Planner stays untouched
          export MISSIONPLANNER_DATA_DIR="$RUNNER_TEMP/mp-data-hidpi" ALLUSERSPROFILE="$RUNNER_TEMP/mp-data-hidpi-logs"
          for mode in opengl gdi; do
              if [[ $mode == gdi ]]; then export MISSIONPLANNER_NO_OPENGL=1; fi
              "$app/Contents/MacOS/MissionPlanner" > "out/hidpi-$mode.log" 2>&1 &
              pid=$!
              sleep 50
              perl -e 'alarm 15; exec @ARGV' osascript -e 'tell application id "org.ardupilot.missionplanner" to activate' > /dev/null 2>&1 || true
              sleep 3
              screencapture -x -m "out/hidpi-$mode.png" || true
              echo "RETINA $mode: $(sips -g pixelWidth -g pixelHeight "out/hidpi-$mode.png" 2>/dev/null | awk '/pixel/ {printf "%s ", $2}')"
              grep -E 'OpenGL view attached|OpenGL backing scale|HUD OpenGL' "out/hidpi-$mode.log" | sort -u | head -5 || true
              if kill -0 "$pid" 2>/dev/null; then echo "RETINA $mode: running"; else echo "RETINA $mode: exited"; fi
              kill "$pid" 2>/dev/null; sleep 2; kill -9 "$pid" 2>/dev/null || true
          done
          kill "$display_pid" 2>/dev/null || true
      - name: Sign with Developer ID and notarize
        # only when the repository has the secrets of an Apple Developer Program account
        # (macOS/native/sign-notarize.sh lists them); otherwise the app stays signed ad hoc
        if: always()
        timeout-minutes: 35
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          app=$(head -1 out/mp-app.txt 2>/dev/null || true)
          if [[ -z $MACOS_CERTIFICATE || -z $app ]]; then
              echo "No Developer ID secrets: the app is signed ad hoc"
              exit 0
          fi
          ./macOS/native/sign-notarize.sh "$app" MissionPlanner-macos-native-arm64.zip 2>&1 | tee out/sign-notarize.log
      - name: Smaller screenshots
        # JPEG instead of PNG keeps the results (and the ci-native branch) small
        if: always()
        run: |
          # (the HUD's back buffer stays PNG: JPEG blurs the colour of thin text)
          find out -name '*.png' ! -name 'hud-back-buffer.png' | while IFS= read -r f; do
              sips -s format jpeg -s formatOptions 60 "$f" --out "${f%.png}.jpg" > /dev/null 2>&1 && rm -f "$f"
          done
          du -sh out
      - name: Keep the app on this Mac
        # a self-hosted runner is the Mac the app is for: it stays here (installed by the
        # next step, and the zip outside the workspace, which checkout cleans), with no
        # upload to GitHub's artifact storage
        if: success() && runner.environment == 'self-hosted'
        run: |
          mkdir -p "$HOME/MissionPlanner-native"
          cp MissionPlanner-macos-native-arm64.zip "$HOME/MissionPlanner-native/"
          echo "$GITHUB_SHA $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$HOME/MissionPlanner-native/BUILD.txt"
          echo "KEPT: $HOME/MissionPlanner-native/MissionPlanner-macos-native-arm64.zip"
      - uses: actions/upload-artifact@v4
        id: upload_app
        if: always() && runner.environment != 'self-hosted'
        # a full artifact storage (the account's quota) must not fail the build and tests:
        # the install step then uses the same zip from disk, and the last step says so
        continue-on-error: true
        with:
          name: MissionPlanner-macos-native-arm64
          path: MissionPlanner-macos-native-arm64.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Install with install.sh
        # the app just built, installed as a user would, then opened: from the uploaded
        # artifact (GitHub CLI, no browser) or, on a self-hosted runner, from the zip here,
        # where it is the delivered app (so a failure fails the run)
        if: success()
        continue-on-error: ${{ runner.environment != 'self-hosted' }}
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          APP_UPLOAD: ${{ steps.upload_app.outcome }}
        run: |
          # a leftover MissionPlanner process from an earlier step (e.g. the Retina one,
          # continue-on-error) would make install.sh refuse to run: clear CI's own copies only
          # (on a self-hosted runner, a Mission Planner the owner has open is theirs to quit,
          # and install.sh says so)
          pkill -f "$GITHUB_WORKSPACE/.*Contents/MacOS/MissionPlanner" 2>/dev/null && sleep 2 || true
          pkill -f "$HOME/Applications/Mission Planner.app/Contents/MacOS/MissionPlanner" 2>/dev/null && sleep 2 || true
          if [[ $APP_UPLOAD == success ]]; then
              export MP_RUN=${{ github.run_id }}
          else
              export MP_ZIP="$PWD/MissionPlanner-macos-native-arm64.zip"
              echo "INSTALL: from the local zip (artifact upload: $APP_UPLOAD)"
          fi
          MP_REPO=${{ github.repository }} MP_APPLICATIONS="$HOME/Applications" MP_NO_OPEN=1 \
              ./macOS/native/install.sh
          app="$HOME/Applications/Mission Planner.app"
          if xattr "$app" | grep -q com.apple.quarantine; then echo "INSTALL: quarantined"; else echo "INSTALL: no quarantine attribute"; fi
          export MISSIONPLANNER_DATA_DIR="$RUNNER_TEMP/mp-data-install" ALLUSERSPROFILE="$RUNNER_TEMP/mp-data-install-logs"
          open "$app"
          sleep 45
          running=0
          if pgrep -f "$app/Contents/MacOS/MissionPlanner" >/dev/null; then running=1; echo "INSTALLED APP: running"; else echo "INSTALLED APP: not running"; fi
          pkill -f "$app/Contents/MacOS/MissionPlanner" || true
          [[ $running == 1 ]]

      - name: Publish results to the ci-native branch
        # logs and screenshots, readable with git; straight from here rather than through an
        # artifact, which a full artifact storage (the account's quota) would stop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          APP_UPLOAD: ${{ steps.upload_app.outcome }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          publish=$(mktemp -d)
          cp -R out/. "$publish/"
          cd "$publish"
          # (not RESULT.txt: on macOS's case-insensitive file system that is out/result.txt)
          echo "commit=$GITHUB_SHA outcome=$OUTCOME app-artifact=$APP_UPLOAD runner=$RUNNER_ENVIRONMENT run=$RUN" > RUN.txt
          git init -q -b ci-native
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "native results for $GITHUB_SHA ($OUTCOME)"
          for attempt in 1 2 3; do
              git push -q -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" ci-native && break
              [[ $attempt == 3 ]] && exit 1
              sleep $((attempt * 15))
          done
          cd / && rm -rf -- "$publish"
