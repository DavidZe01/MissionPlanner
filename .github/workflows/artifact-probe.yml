name: Artifact storage probe

# Uploads a tiny artifact to tell whether the account's artifact storage accepts
# uploads again (after old artifacts were deleted and the quota recalculated), before
# spending a full macos-native.yml run on it. Runs when a push to macos-arm64 changes
# .github/artifact-probe-request.
on:
  push:
    branches: [macos-arm64]
    paths: ['.github/artifact-probe-request']

permissions:
  contents: read

jobs:
  probe:
    # the owner's Mac: GitHub-hosted runners do not start while the account is locked
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - run: echo "artifact storage probe $GITHUB_RUN_ID" > probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-probe
          path: probe.txt
          retention-days: 1
