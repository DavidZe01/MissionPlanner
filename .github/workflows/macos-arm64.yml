name: macOS Apple Silicon

# Manual only: macOS runners are expensive, so ordinary pushes start nothing.
# Default (smoke): build, package the app and a ~2 minute startup test (about
# 20 runner-minutes in total). probe adds ~10 minutes of platform checks
# (video, vehicle link, board detection, Bluetooth/camera permissions, XQuartz);
# full adds the screen tours (about 2 h). Linux ARM64 is opt-in.
on:
  # The default (smoke) build runs when a push to macos-arm64 changes the file
  # .github/macos-build-request (other pushes start nothing), or when a tag
  # named macos-build-<anything> is created. The Actions "Run workflow" button
  # offers the options below.
  push:
    branches: [macos-arm64]
    paths: ['.github/macos-build-request']
    tags: ['macos-build-*']
  workflow_dispatch:
    inputs:
      tests:
        description: 'smoke = startup test only; probe = + platform checks (~10 min); full = + screen tours with SITL (about 2 h of macOS runner)'
        type: choice
        options: [smoke, probe, full]
        default: smoke
      linux_arm64:
        description: 'Also build and test the Linux ARM64 package'
        type: boolean
        default: false

concurrency:
  # never two runs of this workflow at once
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # smoke, probe or full: the Run workflow choice, or [tests=probe] / [tests=full] in the
  # message of the commit that changed .github/macos-build-request
  TESTS: ${{ inputs.tests || (contains(github.event.head_commit.message, '[tests=full]') && 'full') || (contains(github.event.head_commit.message, '[tests=probe]') && 'probe') || 'smoke' }}

defaults:
  run:
    shell: bash

jobs:
  managed:
    name: Build managed application
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mono-devel rsync
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: linux-nuget-${{ hashFiles('**/*.csproj', 'Linux/Build.targets') }}
          restore-keys: linux-nuget-
      - name: Build
        run: ./Linux/build.sh 2>&1 | tee managed-build.log
      - name: Build macOS test tools
        run: ./macOS/build-tests.sh bin/linux/MissionPlanner-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: managed
          path: bin/linux/MissionPlanner-linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  sitl:
    # ArduPilot publishes no macOS simulator builds: build them natively.
    name: Build ArduPilot SITL for macOS
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - id: ap
        run: |
          sha=$(git ls-remote https://github.com/ArduPilot/ardupilot refs/tags/ArduCopter-stable | cut -f1)
          [[ -n $sha ]] || { echo "could not resolve ArduCopter-stable"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: sitl-bin
          key: sitl-macos-${{ runner.arch }}-${{ steps.ap.outputs.sha }}
      # Caches are per branch/tag, so a tag-triggered run misses the cache:
      # reuse the newest "sitl" artifact of an earlier run when it is the same
      # ArduPilot commit, instead of compiling ArduPilot again.
      - id: prev
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=sitl&per_page=50" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty' || true)
          echo "previous sitl artifact: run ${run:-none}"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.prev.outputs.run != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sitl
          path: sitl-prev
          run-id: ${{ steps.prev.outputs.run }}
          github-token: ${{ github.token }}
      - id: reuse
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if [[ -x sitl-prev/ArduCopter || -f sitl-prev/ArduCopter ]] && grep -qF "${{ steps.ap.outputs.sha }}" sitl-prev/VERSION.txt 2>/dev/null; then
            rm -rf sitl-bin && mv sitl-prev sitl-bin && chmod +x sitl-bin/Ardu*
            echo "reusing simulators from run ${{ steps.prev.outputs.run }}"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "no reusable simulators; building"
          fi
      - name: Build simulators
        if: steps.cache.outputs.cache-hit != 'true' && steps.reuse.outputs.hit != 'true'
        run: |
          git clone -q --depth 1 --branch ArduCopter-stable --recurse-submodules --shallow-submodules \
            https://github.com/ArduPilot/ardupilot ardupilot
          python3 -m venv venv && . venv/bin/activate
          pip install -q empy==3.3.4 pexpect future ptyprocess lxml
          cd ardupilot
          ./waf configure --board sitl > ../waf-configure.log 2>&1 || { tail -50 ../waf-configure.log; exit 1; }
          ./waf copter heli plane rover 2>&1 | tail -20
          mkdir -p ../sitl-bin
          cp build/sitl/bin/arducopter ../sitl-bin/ArduCopter
          cp build/sitl/bin/arducopter-heli ../sitl-bin/ArduHeli
          cp build/sitl/bin/arduplane ../sitl-bin/ArduPlane
          cp build/sitl/bin/ardurover ../sitl-bin/ArduRover
          cp Tools/autotest/default_params/copter.parm ../sitl-bin/
          echo "ArduPilot ArduCopter-stable ${{ steps.ap.outputs.sha }} $(git describe --tags --always)" > ../sitl-bin/VERSION.txt
      - run: file sitl-bin/*; cat sitl-bin/VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sitl
          path: sitl-bin
          retention-days: 7

  macos:
    name: Package and test on macOS
    needs: [managed, sitl]
    runs-on: macos-26
    timeout-minutes: ${{ (inputs.tests == 'full' || contains(github.event.head_commit.message, '[tests=full]')) && 150 || 60 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: managed
      - uses: actions/download-artifact@v4
        with:
          name: sitl
          path: sitl-bin
      - name: Install dependencies
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install mono pkgconf cairo pango giflib libtiff libexif jpeg-turbo libpng libx11 \
            dylibbundler netpbm sdl2 gstreamer libusb
          brew install --cask xquartz
          uname -m; sw_vers; mono --version | head -2; lipo -archs "$(brew --prefix mono)/bin/mono"
      - name: Package app
        run: |
          mkdir managed && tar -xzf MissionPlanner-linux-x86_64.tar.gz -C managed
          MP_SITL_DIR=$PWD/sitl-bin ./macOS/package.sh managed/MissionPlanner-linux-x86_64 bin/macos 2>&1 | tee package.log
      - uses: actions/upload-artifact@v4
        with:
          name: MissionPlanner-macos-${{ runner.arch }}
          path: |
            bin/macos/MissionPlanner-macos-*.zip
            bin/macos/MissionPlanner-macos-*.zip.sha256
          compression-level: 0
          retention-days: 30
      - name: Startup test
        timeout-minutes: 10
        env:
          CI_TEST_PART: smoke
        run: ./macOS/ci-test.sh "bin/macos/Mission Planner.app" ci-out
      - name: Screen tour without a vehicle
        if: env.TESTS == 'full'
        timeout-minutes: 60
        env:
          CI_TEST_PART: offline
        run: ./macOS/ci-test.sh "bin/macos/Mission Planner.app" ci-out
      - name: Screen tour connected to the simulator
        if: env.TESTS == 'full' && !cancelled()
        timeout-minutes: 50
        env:
          CI_TEST_PART: connected
        run: ./macOS/ci-test.sh "bin/macos/Mission Planner.app" ci-out
      - name: Probe platform services
        if: (env.TESTS == 'full' || env.TESTS == 'probe') && !cancelled()
        timeout-minutes: 20
        run: ./macOS/ci-probe.sh "bin/macos/Mission Planner.app" ci-out/probe
      - name: Convert remaining screenshots
        if: always()
        run: |
          for f in ci-out/*/*.xwd; do
            [ -f "$f" ] || continue
            xwdtopnm "$f" 2>/dev/null | pnmtopng > "${f%.xwd}.png" 2>/dev/null; rm -f "$f"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-macos
          path: |
            ci-out
            package.log
            bin/macos/work/*.log
            bin/macos/work/libgdiplus-*/*.log

  linux-arm64:
    # The same application on native ARM64 Linux (e.g. Ubuntu on Asahi or a Raspberry Pi).
    name: Build and test on Linux ARM64
    if: inputs.linux_arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mono-devel rsync xvfb xauth x11-apps netpbm \
            $(cat Linux/runtime-packages.txt) gstreamer1.0-plugins-base gstreamer1.0-tools
          uname -m; mono --version | head -1
      - name: Build
        run: ./Linux/build.sh 2>&1 | tail -5
      - name: Test
        run: |
          app=bin/linux/MissionPlanner-linux-aarch64
          ./macOS/build-tests.sh "$app"
          mkdir -p ci-out/tour
          xvfb-run -a -s "-screen 0 1400x1000x24" timeout --signal=QUIT --kill-after=10s 300s "$app/run.sh" --self-test > ci-out/smoke.log 2>&1 || true
          grep -E 'SMOKE_RUNTIME|LINUX_SMOKE_TEST_PASS' ci-out/smoke.log
          if [[ "$TESTS" != full ]]; then grep -qx LINUX_SMOKE_TEST_PASS ci-out/smoke.log; exit; fi
          cd "$app"
          export MONO_PATH=$PWD/mono-facades PATH=$PWD/mono-tools:$PATH LD_LIBRARY_PATH=$PWD:$PWD/arm64
          TOUR_OUT=$GITHUB_WORKSPACE/ci-out/tour TOUR_XWD=/usr/bin/xwd TOUR_SKIP=ConfigParamLoading \
            xvfb-run -a -s "-screen 0 1400x1000x24" timeout --signal=QUIT --kill-after=10s 1800s mono ScreenTour.exe > $GITHUB_WORKSPACE/ci-out/tour.log 2>&1 || true
          cd "$GITHUB_WORKSPACE"
          grep -E '^TOUR_(RUNTIME|DONE)|^TOUR FAIL' ci-out/tour.log | cut -c1-200 || true
          for f in ci-out/tour/*.xwd; do xwdtopnm "$f" 2>/dev/null | pnmtopng > "${f%.xwd}.png" && rm -f "$f"; done
          grep -qx LINUX_SMOKE_TEST_PASS ci-out/smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-linux-arm64
          path: ci-out
      - uses: actions/upload-artifact@v4
        with:
          name: MissionPlanner-linux-aarch64
          path: |
            bin/linux/MissionPlanner-linux-aarch64.tar.gz
            bin/linux/MissionPlanner-linux-aarch64.tar.gz.sha256
          retention-days: 30

  results:
    # Publish logs and screenshots to the ci-results branch so they can be
    # read with git (artifact downloads need a browser login).
    name: Publish results
    needs: [macos, linux-arm64]
    if: >-
      always() && (inputs.tests == 'full' || inputs.tests == 'probe' ||
      contains(github.event.head_commit.message, '[tests=full]') || contains(github.event.head_commit.message, '[tests=probe]'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
      - name: Push results branch
        env:
          SHA: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: macos=${{ needs.macos.result }} linux-arm64=${{ needs.linux-arm64.result }}
        run: |
          cd results
          echo "commit=$SHA outcome=$OUTCOME run=$RUN" > RESULT.txt
          git init -q -b ci-results
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "macOS results for $SHA ($OUTCOME)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results
