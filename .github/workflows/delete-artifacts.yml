name: Delete old artifacts

# One-off cleanup the repository owner asked for: the account's artifact storage quota
# was full, so macos-native.yml could no longer upload the app. Deletes every artifact
# except the SITL builds (macos-native.yml downloads them for the simulator). Runs when a
# push to macos-arm64 changes .github/delete-artifacts-request.
on:
  push:
    branches: [macos-arm64]
    paths: ['.github/delete-artifacts-request']

permissions:
  actions: write

jobs:
  delete:
    # the owner's Mac: GitHub-hosted runners do not start while the account is locked
    # for billing ("The job was not started because your account is locked")
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Delete every artifact but sitl
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # list first, then delete: deleting while paging would skip entries
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name != "sitl") | "\(.id) \(.size_in_bytes) \(.name)"' > artifacts.txt
          echo "to delete: $(wc -l < artifacts.txt) artifacts, $(awk '{s += $2} END {print int(s / 1048576)}' artifacts.txt) MB"
          deleted=0
          failed=0
          while read -r id size name; do
              if gh api -X DELETE "repos/$REPO/actions/artifacts/$id" > /dev/null; then
                  deleted=$((deleted + 1))
              else
                  failed=$((failed + 1))
                  echo "could not delete $id ($name)"
              fi
          done < artifacts.txt
          echo "deleted $deleted, failed $failed"
          echo "kept: $(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[].name' | sort | uniq -c | tr '\n' ' ')"
          [[ $failed == 0 ]]
